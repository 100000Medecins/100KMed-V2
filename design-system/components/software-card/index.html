<!-- @dsCard group="Applicatifs" name="SoftwareCard" subtitle="Carte logiciel — note + étoiles + initiales colorées" -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SoftwareCard — 100000Médecins</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --white:#F4F7FF; --navy:#1B2A4A; --navy-light:#2A3F66; --rating-green:#22C55E; }
  * { box-sizing: border-box; }
  body { font-family: "Poppins", sans-serif; margin: 0; padding: 40px; background: var(--white); color: var(--navy); }
  h1 { font-size: 28px; font-weight: 700; margin: 0 0 4px; }
  .sub { color: var(--navy-light); margin: 0 0 32px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 24px; max-width: 760px; }
  .card { background:#fff; border-radius:16px; box-shadow:0 4px 24px rgba(0,0,0,.06); padding:24px; display:flex; flex-direction:column; align-items:center; text-align:center; transition:all .3s ease; cursor:pointer; }
  .card:hover { box-shadow:0 8px 32px rgba(0,0,0,.10); }
  .name { font-size:12px; font-weight:600; color:#1F2937; margin-bottom:16px; }
  .meta { display:flex; align-items:center; gap:8px; margin-bottom:16px; }
  .badge { display:inline-flex; align-items:center; background:var(--rating-green); color:#fff; font-weight:700; border-radius:999px; font-size:12px; padding:4px 10px; }
  .stars { display:inline-flex; gap:2px; }
  .count { font-size:12px; color:#9CA3AF; }
  .logo { width:100%; height:80px; border-radius:12px; display:flex; align-items:center; justify-content:center; }
  .logo span { font-size:24px; font-weight:700; }
</style>
</head>
<body>
  <h1>SoftwareCard</h1>
  <p class="sub">Carte de la grille logiciels — <code>SoftwareCard.tsx</code>. Compose RatingBadge + StarRating + bloc initiales (couleur de marque à 8 % en fond).</p>

  <div class="grid">
    <div class="card">
      <div class="name">Doctolib</div>
      <div class="meta"><span class="badge">4.6</span><span class="stars" id="r1"></span><span class="count">(284)</span></div>
      <div class="logo" style="background:#4A90D915"><span style="color:#4A90D9">DO</span></div>
    </div>
    <div class="card">
      <div class="name">Maiia</div>
      <div class="meta"><span class="badge">4.2</span><span class="stars" id="r2"></span><span class="count">(96)</span></div>
      <div class="logo" style="background:#E8734A15"><span style="color:#E8734A">MA</span></div>
    </div>
    <div class="card">
      <div class="name">Weda</div>
      <div class="meta"><span class="badge">3.8</span><span class="stars" id="r3"></span><span class="count">(51)</span></div>
      <div class="logo" style="background:#22C55E15"><span style="color:#22C55E">WE</span></div>
    </div>
  </div>

<script>
  function star(px, cls){ return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 24 24" fill="'+cls+'" stroke="'+cls+'" stroke-width="1"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'; }
  function half(px,c){ return '<span style="position:relative;display:inline-block;width:'+px+'px;height:'+px+'px;line-height:0"><span style="position:absolute;inset:0">'+star(px,'#E5E7EB')+'</span><span style="position:absolute;inset:0;width:'+(px/2)+'px;overflow:hidden">'+star(px,c)+'</span></span>'; }
  function render(el, rating){ var f=Math.floor(rating),h=(rating-f)>=0.3,o=''; for(var i=0;i<5;i++){ o += i<f?star(14,'#F5C518'):(i===f&&h?half(14,'#F5C518'):star(14,'#E5E7EB')); } document.getElementById(el).innerHTML=o; }
  render('r1',4.6); render('r2',4.2); render('r3',3.8);
</script>
</body>
</html>
