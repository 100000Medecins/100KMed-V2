<!-- @dsCard group="Applicatifs" name="Breadcrumb" subtitle="Fil d'ariane — variantes default / light" -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Breadcrumb — 100000Médecins</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --white:#F4F7FF; --navy:#1B2A4A; --navy-light:#2A3F66; }
  * { box-sizing: border-box; }
  body { font-family: "Poppins", sans-serif; margin: 0; padding: 40px; background: var(--white); color: var(--navy); }
  h1 { font-size: 28px; font-weight: 700; margin: 0 0 4px; }
  .sub { color: var(--navy-light); margin: 0 0 32px; font-size: 14px; }
  h2 { font-size: 13px; font-weight: 600; margin: 30px 0 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--navy-light); }
  nav { display:inline-flex; align-items:center; gap:6px; font-size:12px; }
  nav .seg { display:inline-flex; align-items:center; gap:6px; }
  .default { color:#9CA3AF; }
  .default a { color:#9CA3AF; text-decoration:none; transition:color .15s; }
  .default a:hover { color:var(--navy); }
  .default .chev { color:#D1D5DB; }
  .default .cur { font-weight:600; color:var(--navy); }
  .panel-dark { background:var(--navy); border-radius:16px; padding:20px; }
  .light { color:#fff; }
  .light a { color:rgba(255,255,255,.7); text-decoration:none; transition:color .15s; }
  .light a:hover { color:#fff; }
  .light .chev { color:rgba(255,255,255,.6); }
  .light .cur { font-weight:600; color:#fff; }
  .chev svg { display:block; }
</style>
</head>
<body>
  <h1>Breadcrumb</h1>
  <p class="sub">Fil d'ariane — <code>Breadcrumb.tsx</code>. Dernier segment en gras non cliquable.</p>

  <h2>Variante default</h2>
  <nav class="default">
    <span class="seg"><a href="#">Accueil</a></span>
    <span class="seg"><span class="chev"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span><a href="#">Agendas</a></span>
    <span class="seg"><span class="chev"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span><span class="cur">Doctolib</span></span>
  </nav>

  <h2>Variante light (sur fond sombre)</h2>
  <div class="panel-dark">
    <nav class="light">
      <span class="seg"><a href="#">Accueil</a></span>
      <span class="seg"><span class="chev"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span><a href="#">Agendas</a></span>
      <span class="seg"><span class="chev"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span><span class="cur">Doctolib</span></span>
    </nav>
  </div>
</body>
</html>
